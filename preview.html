<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#14161b; --card:#1b1e25; --line:#2b303a; --fg:#dfe3ea; --dim:#8b93a3; --accent:#6fb3ff; --pick:#f2b04c }
  * { box-sizing:border-box }
  body { margin:0; padding:24px; background:var(--bg); color:var(--fg);
         font:14px/1.6 ui-sans-serif,system-ui,"Segoe UI",sans-serif }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin:0 0 12px }
  h2 { font-size:14px; font-weight:600; margin:0 0 10px }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:6px }
  button { display:flex; gap:8px; align-items:baseline; overflow:hidden; text-align:left;
           background:#22262f; color:var(--fg); border:1px solid var(--line); border-radius:7px;
           padding:7px 10px; cursor:pointer; font:inherit }
  button:hover { border-color:var(--accent) }
  button.on { border-color:var(--accent); background:#26303d }
  button.pick { border-color:#4a3c22 }
  button.pick.on { border-color:var(--pick); background:#33291a }
  button b { white-space:nowrap }
  button u { white-space:nowrap; color:var(--pick); font-size:10px; text-decoration:none;
             border:1px solid #4a3c22; border-radius:4px; padding:0 4px }
  button i { margin-left:auto; color:var(--dim); font-style:normal; font-size:11px; font-variant-numeric:tabular-nums }
</style>
</head>
<body>

<div id="app"></div>
<audio id="player" preload="auto"></audio>

<script>
  const FAMILIES = [["alert", 10], ["bip-bop", 10], ["staplebops", 7], ["nope", 12], ["yup", 6]];
  const TAGS = { "bip-bop-01": "done", "bip-bop-03": "question", "nope-03": "error", "alert-01": "alert", "yup-01": "longrun" };

  const app = document.getElementById("app");
  const player = document.getElementById("player");
  const buttons = [];

  for (const [key, n] of FAMILIES) {
    const sec = document.createElement("section");
    const pad = (i) => String(i).padStart(2, "0");
    sec.innerHTML = `<h2>${key}-01 … ${key}-${pad(n)}</h2><div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    for (let i = 1; i <= n; i++) {
      const id = `${key}-${pad(i)}`;
      const b = document.createElement("button");
      b.dataset.src = `sounds/${id}.wav`;
      b.innerHTML = `<b>${id}</b>${TAGS[id] ? `<u>${TAGS[id]}</u>` : ""}<i></i>`;
      if (TAGS[id]) b.classList.add("pick");
      grid.appendChild(b);
      buttons.push(b);
    }
    app.appendChild(sec);
  }

  for (const b of buttons) {
    const probe = new Audio(b.dataset.src);
    probe.addEventListener("loadedmetadata", () => { b.querySelector("i").textContent = probe.duration.toFixed(2) + "s"; });
    b.addEventListener("click", () => {
      for (const o of buttons) o.classList.toggle("on", o === b);
      player.src = b.dataset.src;
      player.currentTime = 0;
      player.play();
    });
  }

  player.addEventListener("ended", () => { for (const o of buttons) o.classList.remove("on"); });
</script>
</body>
</html>
